<svg xmlns="http://www.w3.org/2000/svg" width="460" height="280" viewBox="0 0 460 280" role="img" aria-label="All-time GitHub stats including private repositories">
<style>
  text { font-family: 'Segoe UI', Ubuntu, Helvetica, sans-serif; }
  .title { font-size: 17px; font-weight: 700; fill: #a371f7; }
  .sub { font-size: 11px; fill: #8b949e; }
  .lbl { font-size: 14px; fill: #c9d1d9; }
  .row { opacity: 0; animation: rise 0.6s ease-out forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); }
                     to { opacity: 1; transform: translateY(0); } }
</style>
<rect x="0.5" y="0.5" width="459" height="279" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="26" y="34" class="title">All-Time Stats</text>
<text x="26" y="50" class="sub">public + private repositories</text>
<g class="row" style="animation-delay:0.20s"><text x="26" y="78" class="lbl">Total Commits</text><text x="434" y="78" text-anchor="end" style="font-size:19px;font-weight:700;fill:#a371f7">1,588</text><rect x="26" y="86" width="408" height="1" fill="#30363d" opacity="0.5"/></g><g class="row" style="animation-delay:0.32s"><text x="26" y="112" class="lbl">Private Commits</text><text x="434" y="112" text-anchor="end" style="font-size:15px;font-weight:500;fill:#c9d1d9">1,566</text><rect x="26" y="120" width="408" height="1" fill="#30363d" opacity="0.5"/></g><g class="row" style="animation-delay:0.44s"><text x="26" y="146" class="lbl">Public Commits</text><text x="434" y="146" text-anchor="end" style="font-size:15px;font-weight:500;fill:#c9d1d9">22</text><rect x="26" y="154" width="408" height="1" fill="#30363d" opacity="0.5"/></g><g class="row" style="animation-delay:0.56s"><text x="26" y="180" class="lbl">Pull Requests</text><text x="434" y="180" text-anchor="end" style="font-size:15px;font-weight:500;fill:#c9d1d9">140</text><rect x="26" y="188" width="408" height="1" fill="#30363d" opacity="0.5"/></g><g class="row" style="animation-delay:0.68s"><text x="26" y="214" class="lbl">Repositories</text><text x="434" y="214" text-anchor="end" style="font-size:15px;font-weight:500;fill:#c9d1d9">30</text><rect x="26" y="222" width="408" height="1" fill="#30363d" opacity="0.5"/></g><g class="row" style="animation-delay:0.80s"><text x="26" y="248" class="lbl">Followers</text><text x="434" y="248" text-anchor="end" style="font-size:15px;font-weight:500;fill:#c9d1d9">10</text><rect x="26" y="256" width="408" height="1" fill="#30363d" opacity="0.5"/></g>
</svg>