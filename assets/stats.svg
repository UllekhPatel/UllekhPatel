                     to { opacity: 1; transform: translateY(0); } }
</style>
<rect x="0.5" y="0.5" width="879" height="117" rx="12" fill="#0d1117" stroke="#30363d"/>
<g class="fx">
  <text x="28" y="74" class="num">1,601</text>
  <text x="219.4" y="62" class="lab">TOTAL CONTRIBUTIONS</text>
  <text x="219.4" y="82" class="sub">public + private &#183; since 2022</text>
</g>
</svg>