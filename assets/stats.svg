<svg xmlns="http://www.w3.org/2000/svg" width="880" height="118" viewBox="0 0 880 118" role="img" aria-label="Total contributions: 1,601">
<style>
  text { font-family: 'Segoe UI', Ubuntu, Helvetica, sans-serif; }
  .num { font-size: 54px; font-weight: 700; fill: #a371f7; }
  .lab { font-size: 15px; font-weight: 600; fill: #c9d1d9; letter-spacing: 1.5px; }
  .sub { font-size: 12px; fill: #8b949e; }
  .fx { opacity: 0; animation: rise .7s ease-out .15s forwards; }
