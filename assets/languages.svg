<svg xmlns="http://www.w3.org/2000/svg" width="880" height="132" viewBox="0 0 880 132" role="img" aria-label="Top languages across all repositories">
<style>
  text { font-family: 'Segoe UI', Ubuntu, Helvetica, sans-serif; }
  .ttl { font-size: 16px; font-weight: 700; fill: #a371f7; }
  .lab { font-size: 13px; fill: #c9d1d9; }
  .pct { font-size: 13px; font-weight: 600; fill: #8b949e; }
  .fx { opacity: 0; animation: rise .6s ease-out forwards; }
  #bar { animation: grow 1.1s cubic-bezier(.4,0,.2,1) forwards; transform-origin: 28px 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); }
                     to { opacity: 1; transform: translateY(0); } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
<rect x="0.5" y="0.5" width="879" height="131" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="28" y="36" class="ttl">Languages</text>
<clipPath id="r"><rect x="28" y="56" width="824" height="12" rx="6"/></clipPath>
<g clip-path="url(#r)" id="bar"><rect x="28.0" y="56" width="330.6" height="12" fill="#3178c6"/><rect x="358.6" y="56" width="167.2" height="12" fill="#3572A5"/><rect x="525.8" y="56" width="121.6" height="12" fill="#f1e05a"/><rect x="647.4" y="56" width="119.5" height="12" fill="#DA5B0B"/><rect x="766.9" y="56" width="85.1" height="12" fill="#00ADD8"/></g>
<g class="fx" style="animation-delay:0.35s"><circle cx="33.0" cy="98" r="5" fill="#3178c6"/><text x="44.0" y="103" class="lab">TypeScript</text><text x="121.5" y="103" class="pct">40.1%</text></g><g class="fx" style="animation-delay:0.42s"><circle cx="194.9" cy="98" r="5" fill="#3572A5"/><text x="205.9" y="103" class="lab">Python</text><text x="254.8" y="103" class="pct">20.3%</text></g><g class="fx" style="animation-delay:0.49s"><circle cx="328.1" cy="98" r="5" fill="#f1e05a"/><text x="339.1" y="103" class="lab">JavaScript</text><text x="416.6" y="103" class="pct">14.8%</text></g><g class="fx" style="animation-delay:0.56s"><circle cx="490.0" cy="98" r="5" fill="#DA5B0B"/><text x="501.0" y="103" class="lab">Jupyter Notebook</text><text x="621.4" y="103" class="pct">14.5%</text></g><g class="fx" style="animation-delay:0.63s"><circle cx="694.7" cy="98" r="5" fill="#00ADD8"/><text x="705.7" y="103" class="lab">Go</text><text x="726.0" y="103" class="pct">10.3%</text></g>
</svg>