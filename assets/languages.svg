<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250" role="img" aria-label="Top languages across all repositories including private">
<style>
  text { font-family: 'Segoe UI', Ubuntu, Helvetica, sans-serif; }
  .title { font-size: 17px; font-weight: 700; fill: #a371f7; }
  .sub { font-size: 11px; fill: #8b949e; }
  .lbl { font-size: 14px; fill: #c9d1d9; }
  .pct { font-size: 13px; fill: #8b949e; font-weight: 600; }
  .row { opacity: 0; animation: rise 0.6s ease-out forwards; }
  #bar { animation: grow 1.1s cubic-bezier(.4,0,.2,1) forwards; transform-origin: 26px 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); }
                     to { opacity: 1; transform: translateY(0); } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
<rect x="0.5" y="0.5" width="459" height="249" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="26" y="34" class="title">Top Languages</text>
<text x="26" y="50" class="sub">across all repositories, by bytes of code</text>
<clipPath id="r"><rect x="26" y="62" width="408" height="10" rx="5"/></clipPath>
<g clip-path="url(#r)" id="bar"><rect x="26.0" y="62" width="161.9" height="10" fill="#3178c6"/><rect x="187.9" y="62" width="81.8" height="10" fill="#3572A5"/><rect x="269.7" y="62" width="59.6" height="10" fill="#f1e05a"/><rect x="329.3" y="62" width="58.5" height="10" fill="#DA5B0B"/><rect x="387.8" y="62" width="41.7" height="10" fill="#00ADD8"/><rect x="429.5" y="62" width="4.5" height="10" fill="#e34c26"/></g>
<g class="row" style="animation-delay:0.30s"><circle cx="32" cy="100" r="5" fill="#3178c6"/><text x="48" y="104" class="lbl">TypeScript</text><text x="434" y="104" text-anchor="end" class="pct">39.7%</text></g><g class="row" style="animation-delay:0.40s"><circle cx="32" cy="130" r="5" fill="#3572A5"/><text x="48" y="134" class="lbl">Python</text><text x="434" y="134" text-anchor="end" class="pct">20.1%</text></g><g class="row" style="animation-delay:0.50s"><circle cx="32" cy="160" r="5" fill="#f1e05a"/><text x="48" y="164" class="lbl">JavaScript</text><text x="434" y="164" text-anchor="end" class="pct">14.6%</text></g><g class="row" style="animation-delay:0.60s"><circle cx="32" cy="190" r="5" fill="#DA5B0B"/><text x="48" y="194" class="lbl">Jupyter Notebook</text><text x="434" y="194" text-anchor="end" class="pct">14.3%</text></g><g class="row" style="animation-delay:0.70s"><circle cx="32" cy="220" r="5" fill="#00ADD8"/><text x="48" y="224" class="lbl">Go</text><text x="434" y="224" text-anchor="end" class="pct">10.2%</text></g><g class="row" style="animation-delay:0.80s"><circle cx="32" cy="250" r="5" fill="#e34c26"/><text x="48" y="254" class="lbl">HTML</text><text x="434" y="254" text-anchor="end" class="pct">1.1%</text></g>
</svg>