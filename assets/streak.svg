<svg xmlns="http://www.w3.org/2000/svg" width="880" height="92" viewBox="0 0 880 92" role="img" aria-label="0 day contribution streak, longest 19 days">
<style>
  text { font-family: 'Segoe UI', Ubuntu, Helvetica, sans-serif; }
  .num { font-size: 30px; font-weight: 700; fill: #8b949e; }
  .cap { font-size: 10px; font-weight: 600; fill: #c9d1d9; letter-spacing: 1.2px; }
  .dl  { font-size: 10px; font-weight: 600; fill: #8b949e; }
  .rt  { font-size: 10px; font-weight: 600; fill: #8b949e; letter-spacing: 1.2px; }
  .rv  { font-size: 17px; font-weight: 700; fill: #c9d1d9; }
  .pop { opacity: 0; transform-box: fill-box; transform-origin: center;
          animation: pop .45s cubic-bezier(.34,1.56,.64,1) forwards; }
  #flame { transform-box: fill-box; transform-origin: 50% 90%; animation: none; }
  @keyframes pop { 0% { opacity:0; transform: scale(.4); }
                    100% { opacity:1; transform: scale(1); } }
  @keyframes flicker { 0%,100% { transform: scale(1) rotate(0deg); }
                        35% { transform: scale(1.08,1.13) rotate(-2deg); }
                        70% { transform: scale(.96,1.04) rotate(2deg); } }
</style>
<rect x="0.5" y="0.5" width="879" height="91" rx="10" fill="#0d1117" stroke="#30363d"/>
<path id="flame" d="M44,22 c7,11 15,15 15,26 a15,15 0 0 1 -30,0 c0,-6 3,-10 6,-14 c1,4 3,6 5,7 c-2,-8 0,-15 4,-19 z"
      fill="#3d434b"/>
<path d="M44,44 c3,4 6,6 6,11 a6,6 0 0 1 -12,0 c0,-4 3,-7 6,-11 z" fill="#4a5058"/>
<text x="72" y="52" class="num">0</text>
<text x="72" y="68" class="cap">DAY STREAK</text>
<line x1="300" y1="22" x2="300" y2="70" stroke="#30363d"/>
<g class="pop" style="animation-delay:0.25s"><circle cx="330" cy="44" r="13" fill="#3d434b" stroke="#3d434b" stroke-width="2"/><path d="M325,44 l3.5,4 l6.5,-8" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="74" text-anchor="middle" class="dl">T</text></g><g class="pop" style="animation-delay:0.31s"><circle cx="376" cy="44" r="13" fill="#3d434b" stroke="#3d434b" stroke-width="2"/><path d="M371,44 l3.5,4 l6.5,-8" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="376" y="74" text-anchor="middle" class="dl">W</text></g><g class="pop" style="animation-delay:0.37s"><circle cx="422" cy="44" r="13" fill="#3d434b" stroke="#3d434b" stroke-width="2"/><path d="M417,44 l3.5,4 l6.5,-8" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="422" y="74" text-anchor="middle" class="dl">T</text></g><g class="pop" style="animation-delay:0.43s"><circle cx="468" cy="44" r="13" fill="none" stroke="#30363d" stroke-width="2"/><text x="468" y="74" text-anchor="middle" class="dl">F</text></g><g class="pop" style="animation-delay:0.49s"><circle cx="514" cy="44" r="13" fill="none" stroke="#30363d" stroke-width="2"/><text x="514" y="74" text-anchor="middle" class="dl">S</text></g><g class="pop" style="animation-delay:0.55s"><circle cx="560" cy="44" r="13" fill="none" stroke="#30363d" stroke-width="2"/><text x="560" y="74" text-anchor="middle" class="dl">S</text></g><g class="pop" style="animation-delay:0.61s"><circle cx="606" cy="44" r="13" fill="none" stroke="#30363d" stroke-width="2"/><text x="606" y="74" text-anchor="middle" class="dl">M</text></g>
<line x1="690" y1="22" x2="690" y2="70" stroke="#30363d"/>
<text x="856" y="44" text-anchor="end" class="rt">LONGEST</text>
<text x="856" y="68" text-anchor="end" class="rv">19 days</text>
