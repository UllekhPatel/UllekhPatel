name: Refresh profile

on:
  schedule:
    # 18:30 UTC = 00:00 IST, the author's midnight. Deliberately off the top of
    # the hour and out of the 00-03 UTC band, which is the most oversubscribed
    # window on Actions - GitHub delays or drops scheduled runs there.
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gen_stats.py
      - .github/workflows/stats.yml

# Both jobs are required for the README to stay current: `cards` redraws the
# stats and contribution graph, `snake` redraws the contribution animation.
# Neither needs a PAT - the built-in GITHUB_TOKEN is sufficient, because the
# account exposes private contributions on its profile.
jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and commit
        # Regenerate *after* syncing to origin, and retry, so a concurrent push
        # to main cannot make this job fail or clobber someone else's commit.
        # Output is a pure function of the API, so regenerating post-sync is safe.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/gen_stats.py
            if [ -z "$(git status --porcelain assets README.md)" ]; then
              echo "No change."
              exit 0
            fi
            git add assets README.md
            git commit -m "chore: refresh profile cards [skip ci]"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push raced; retrying."
            sleep 5
          done
          echo "Could not push after 3 attempts." >&2
          exit 1

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
